; Desk Buddy - ESP32-C3 Super Mini
; Faces on a 0.96" SSD1306 OLED, TTP223 touch, DFPlayer Mini audio.
;
; Core dir is kept inside the repo so nothing is installed system-wide.
; Build:  PLATFORMIO_CORE_DIR=../.pio-core ../.venv-pio/bin/pio run
; FS:     ... pio run -t buildfs
; Merged: ... pio run -t mergebin        (see extra_scripts below)

[platformio]

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; --- flash layout: 4 MB, dual-OTA app slots + 320 KB LittleFS for the web UI ---
board_build.mcu = esp32c3
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=2
  -Wall

lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit BusIO@^1.17.0
  ; Only compiled when AUDIO_DRIVER_PIEZO is set to 0 in include/config.h.
  dfrobot/DFRobotDFPlayerMini@^1.0.5
  bblanchon/ArduinoJson@^7.2.1
  https://github.com/esp32async/AsyncTCP.git#v3.5.0
  https://github.com/esp32async/ESPAsyncWebServer.git#v3.12.1

